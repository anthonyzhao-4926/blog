<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 事件时间轴 · 一轮对话</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --line: #e3e3df;
    --text: #1d1d1b;
    --muted: #6f6f6a;
    --cordis: #d97706;
    --cordis-bg: #fff7ed;
    --record: #6b7280;
    --record-bg: #f4f4f5;
    --focus: #111827;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 26px 32px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: .3px; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; }
  header code {
    background: #f0f0ed; padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 32px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .legend { display: flex; gap: 14px; margin-right: auto; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.cordis { background: var(--cordis); }
  .dot.record { background: var(--record); }
  button {
    font: inherit; font-size: 12.5px; padding: 5px 11px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 999px; transition: .12s;
  }
  button:hover { border-color: #c9c9c4; color: var(--text); }
  button[aria-pressed="true"] { background: var(--focus); border-color: var(--focus); color: #fff; }
  .zoom { display: flex; align-items: center; gap: 6px; margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
  .zoom span { font-size: 12px; color: var(--muted); }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 380px;
    gap: 20px; padding: 22px 32px 60px; align-items: start;
  }
  @media (max-width: 1040px) { main { grid-template-columns: minmax(0, 1fr); } }

  .timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  /* 横向滚动容器：内容有最小宽度，放大后就能左右拖 */
  .scroller { overflow-x: auto; overflow-y: hidden; }
  .scroller::-webkit-scrollbar { height: 10px; }
  .scroller::-webkit-scrollbar-thumb { background: #d7d7d1; border-radius: 5px; }
  .scroller::-webkit-scrollbar-track { background: #fafaf8; }
  .inner { min-width: var(--track, 100%); }

  .axis {
    display: grid; grid-template-columns: var(--left, 300px) minmax(0, 1fr);
    padding: 9px 16px; border-bottom: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); letter-spacing: .4px;
  }
  .axis .scale { display: flex; justify-content: space-between; }

  .row {
    display: grid; grid-template-columns: var(--left, 300px) minmax(0, 1fr);
    padding: 7px 16px; cursor: pointer; border-bottom: 1px solid #f2f2ef;
    transition: background .12s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fafaf8; }
  .row[aria-selected="true"] { background: var(--cordis-bg); }
  .row.hidden { display: none; }

  .label { display: flex; align-items: baseline; gap: 10px; padding-right: 12px; min-width: 0; }
  .label .time { flex: none; width: 52px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .label .name {
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .track { position: relative; height: 18px; }
  .track .fill { position: absolute; top: 4px; height: 10px; border-radius: 3px; min-width: 2px; }
  .track .marker { position: absolute; top: 2px; width: 2px; height: 14px; border-radius: 1px; }
  .fill.cordis, .marker.cordis { background: var(--cordis); }
  .fill.cordis { opacity: .85; }
  .fill.record, .marker.record { background: var(--record); }
  .fill.record { opacity: .45; }
  .track .pct {
    position: absolute; top: 0; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .track .pct.flip { transform: translateX(-100%); }

  aside {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; position: sticky; top: 74px;
  }
  aside .kicker { font-size: 11.5px; letter-spacing: .8px; color: var(--muted); }
  aside h2 { margin: 6px 0 4px; font-size: 17px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  aside .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.cordis { border-color: #fcd9a8; background: var(--cordis-bg); color: #9a3412; }
  .tag.record { border-color: #e4e4e7; background: var(--record-bg); color: #4b5563; }
  aside dl { margin: 0; }
  aside dt { font-size: 12px; color: var(--muted); margin-top: 14px; }
  aside dd { margin: 3px 0 0; font-size: 13.5px; }
  aside pre {
    margin: 8px 0 0; padding: 10px 12px; background: #fafaf8; border: 1px solid var(--line);
    border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.55;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #374151;
  }
  footer { padding: 0 32px 40px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>一轮对话的事件时间轴</h1>
  <p>
    来自一次真实运行：<code>dsh headless '用 shell 工具执行 node -e "console.log(1+1)"'</code>
    时间戳是相对进程启动的毫秒数。点任意一行看它是什么、能用来做什么；时间轴可以左右拖动，也可以放大。
  </p>
</header>

<div class="toolbar">
  <div class="legend">
    <span><i class="dot cordis"></i>Cordis 事件（可干预）</span>
    <span><i class="dot record"></i>会话日志记录（只读）</span>
  </div>
  <button data-filter="all" aria-pressed="true">全部</button>
  <button data-filter="cordis">Cordis 事件</button>
  <button data-filter="record">日志记录</button>
  <div class="zoom">
    <span>缩放</span>
    <button data-zoom="1" aria-pressed="true">1×</button>
    <button data-zoom="2">2×</button>
    <button data-zoom="4">4×</button>
  </div>
</div>

<main>
  <section class="timeline">
    <div class="scroller" id="scroller">
      <div class="inner" id="inner">
        <div class="axis">
          <div class="label"><span class="name" style="color:var(--muted)">事件</span></div>
          <div class="scale"><span>0</span><span>500</span><span>1000</span><span>1500</span><span>2000</span><span>2440ms</span></div>
        </div>
        <!-- rows injected here -->
      </div>
    </div>
  </section>
  <aside id="detail"></aside>
</main>

<footer>
  数据来自一次真实运行（<code>dsh headless</code>），行号与字段名对照仓库里的
  <code>local/deepseek-harness/</code>（0.1.5-rc.2 源码）；运行版本可能与它不同。
  正文见 <a href="../10-事件进阶.md">事件进阶</a>。
</footer>

<script>
const TOTAL = 2440;
// 每一档对应的内容最小宽度：1× 跟随容器，2×/4× 撑开，超出部分横向滚动
const TRACK = { 1: null, 2: '1600px', 4: '3200px' };

const events = [
  {
    seq: 1, t: 106, name: 'session/created', kind: 'cordis', mode: 'emit',
    gist: '会话建立并公告',
    use: '拿到新会话的第一个时机，适合初始化按会话维度的状态、索引或通知。监听器同步抛错会否决这次公告。',
    code: "ctx.on('session/created', (session) => {\n    console.log('新会话', session.id)\n})",
    src: 'packages/core/session/src/index.ts:50'
  },
  {
    seq: 2, t: 107, name: 'agent/created', kind: 'cordis', mode: 'serial',
    gist: 'agent 发布到注册表',
    use: '此时 agent 已配齐、会话已上线。给 agent 挂按身份的资源，或做审计入口。源码声明是 emit，实测按 serial 派发。',
    code: "ctx.on('agent/created', ({ agent }) => {\n    console.log('agent', agent.id)\n})",
    src: 'packages/core/agent/src/runtime-types.ts:258'
  },
  {
    seq: 3, t: 107, name: 'agent/status → running', kind: 'cordis', mode: 'emit',
    gist: '状态翻转：idle → running',
    use: '用它判断 agent 忙不忙。做界面指示、会话生命周期统计，或避免在运行中重复投递任务。',
    code: "ctx.on('agent/status', ({ agent, status }) => {\n    console.log(agent.id, status)\n})",
    src: 'packages/core/agent/src/runtime-types.ts:277'
  },
  {
    seq: 4, t: 107, name: 'agent/inbox/inserted', kind: 'cordis', mode: 'emit',
    gist: '一条消息进入收件箱',
    use: '消息落进队列但还没被认领。可以在这里审计"谁在什么时候说了什么"，或在排队阶段做去重。',
    code: "ctx.on('agent/inbox/inserted', ({ agent, message }) => {\n    console.log(message.role)\n})",
    src: 'packages/core/agent/src/runtime-types.ts:285'
  },
  {
    seq: 5, t: 108, name: '· 记录 turn/start', kind: 'record', mode: 'append',
    gist: '一轮对话开始（写进日志）',
    use: '这是记录不是事件，只能通过 session/event 看。用它切分回放、按轮次计时、生成对话摘要。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'turn/start') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:276'
  },
  {
    seq: 6, t: 108, name: 'agent/inbox/claimed', kind: 'cordis', mode: 'emit',
    gist: '消息被本 turn 认领',
    use: '消息正式进入这一轮。此时还能改主意——比如把它退回队列，或补一条上下文再放行。',
    code: "ctx.on('agent/inbox/claimed', ({ agent, turn }) => {\n    console.log('turn', turn)\n})",
    src: 'packages/core/agent/src/runtime-types.ts:296'
  },
  {
    seq: 7, t: 109, name: 'system-prompt/assemble', kind: 'cordis', mode: 'waterfall',
    gist: '组装系统提示',
    use: '往提示里加自己的段落、变量或工具说明。必须调用 next() 委托给下游，否则会掐断别人的贡献。',
    code: "ctx.on('system-prompt/assemble', async (assembly, _ctx, next) => {\n    const built = await next()\n    built.sections.push({ /* 你的段落 */ })\n    return built\n})",
    src: 'packages/core/system-prompt/src/index.ts:31'
  },
  {
    seq: 8, t: 109, end: 135, name: 'agent/pre-step 进入 → 出来', kind: 'cordis', mode: 'waterfall',
    gist: '本 step 准入，可以拒绝',
    use: '唯一能"不许这一步发生"的地方。next() 返回 { kind: "enter" | "reject" }。26ms 是全部监听器的耗时总和。',
    code: "ctx.on('agent/pre-step', async (_payload, next) => {\n    const decision = await next()\n    if (shouldBlock(decision)) return { kind: 'reject' }\n    return decision\n})",
    src: 'packages/core/agent/src/runtime-types.ts:330'
  },
  {
    seq: 9, t: 137, name: '· 记录 step/start', kind: 'record', mode: 'append',
    gist: '一个 step 开始',
    use: '一轮里可能有多个 step。用它数"这一轮跑了几步"、定位是哪一步出的问题。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'step/start') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:287'
  },
  {
    seq: 10, t: 137, name: 'agent/request', kind: 'cordis', mode: 'waterfall',
    gist: '冻结本次调用配置',
    use: '在这里替换 provider 或 model。配置一旦冻结就进入请求，之后再改已经来不及。',
    code: "ctx.on('agent/request', async (_payload, next) => {\n    const config = await next()\n    return { ...config, model: 'deepseek-flash' }\n})",
    src: 'packages/core/agent/src/runtime-types.ts:347'
  },
  {
    seq: 11, t: 138, name: '· 记录 user/message', kind: 'record', mode: 'append',
    gist: '用户消息落到日志',
    use: '回放和检索的原始素材。注意它是"已提交"的，改不了；要在提交前动手得用 agent/inbox/*。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'user/message') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:297'
  },
  {
    seq: 12, t: 140, end: 1465, name: 'llm/stream', kind: 'cordis', mode: 'waterfall',
    gist: '包住一次流式模型调用',
    use: '做重试、回放、用量统计或请求改写。这里是 1.3 秒的等待，模型在想要不要调工具。',
    code: "ctx.on('llm/stream', (options, next) => {\n    console.log(options.model)\n    return next()\n})",
    src: 'packages/llm/llm/src/index.ts:72'
  },
  {
    seq: 13, t: 1465, name: '· 记录 assistant/message', kind: 'record', mode: 'append',
    gist: '模型这一轮说了什么',
    use: '含工具调用意图。渲染对话、统计 token、回放排查都从这条读。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'assistant/message') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:321'
  },
  {
    seq: 14, t: 1467, name: '· 记录 tool/call', kind: 'record', mode: 'append',
    gist: '模型请求调用某工具',
    use: '先落盘再审。哪怕审批被拒，日志里也不缺这一笔——审计"模型想做什么"看它。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'tool/call') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:341'
  },
  {
    seq: 15, t: 1468, name: 'tools/pre-execute', kind: 'cordis', mode: 'waterfall',
    gist: '批不批：allow / deny / ask',
    use: '拦截危险调用就在这一层。返回 ask 会把请求转给 approval/request，要人拍板。',
    code: "ctx.on('tools/pre-execute', async (exec, next) => {\n    if (isDangerous(exec)) return { kind: 'deny', reason: '...' }\n    return next()\n})",
    src: 'packages/core/tools/src/index.ts:144'
  },
  {
    seq: 16, t: 1468, end: 1533, name: 'tools/execute', kind: 'cordis', mode: 'waterfall',
    gist: '唯一包住真正执行的一层',
    use: '耗时统计挂在它上面才对：这里 65ms 就是 node -e 真正跑掉的时间。也可以改超时或重试。',
    code: "ctx.on('tools/execute', async (exec, next) => {\n    const t0 = Date.now()\n    try { return await next() }\n    finally { console.log(exec.name, Date.now() - t0) }\n})",
    src: 'packages/core/tools/src/index.ts:155'
  },
  {
    seq: 17, t: 1533, name: 'tools/post-execute', kind: 'cordis', mode: 'waterfall',
    gist: '结果接受 / 改写 / 拦掉',
    use: '拿到执行结果后还能动手：裁剪过长输出、补一段提示、或把结果整个换掉。',
    code: "ctx.on('tools/post-execute', async (_exec, _result, next) => {\n    const decision = await next()\n    return decision\n})",
    src: 'packages/core/tools/src/index.ts:167'
  },
  {
    seq: 18, t: 1534, name: 'tools/result', kind: 'cordis', mode: 'emit',
    gist: '冻结后的最终结果（只读）',
    use: '09 篇的统计插件听的就是它。事件已经定稿，能观察不能改，适合审计和计数。',
    code: "ctx.on('tools/result', (exec, result) => {\n    console.log(exec.name, result.isError ? '失败' : '成功')\n})",
    src: 'packages/core/tools/src/index.ts:189'
  },
  {
    seq: 19, t: 1534, name: '· 记录 tool/result', kind: 'record', mode: 'append',
    gist: '工具结果落到日志',
    use: '回放时模型看到的就是这一份。排查"模型为什么这么答"，读它而不是读屏幕上的输出。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'tool/result') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:353'
  },
  {
    seq: 20, t: 1534, name: '· 记录 step/end', kind: 'record', mode: 'append',
    gist: '一个 step 结束',
    use: '和 step/start 配对，用来算每一步的耗时，以及判断这一轮还要不要继续。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'step/end') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:289'
  },
  {
    seq: 21, t: 2422, name: 'agent/turn-stopping', kind: 'cordis', mode: 'serial',
    gist: 'turn 即将关闭（最后机会）',
    use: '按顺序 await 的终检点。可以在这里调 agent.steer() 再做一次引导，让机器继续读收件箱。',
    code: "ctx.on('agent/turn-stopping', ({ agent }) => {\n    if (needMoreWork()) agent.steer('再检查一遍测试')\n})",
    src: 'packages/core/agent/src/runtime-types.ts:391'
  },
  {
    seq: 22, t: 2422, name: '· 记录 turn/end', kind: 'record', mode: 'append',
    gist: '一轮对话结束',
    use: '09 篇在 session/event 里数它做结算。注意它本身不是 Cordis 事件，直接 ctx.on 不会触发。',
    code: "ctx.on('session/event', (_s, event) => {\n    if (event.type === 'turn/end') { /* ... */ }\n})",
    src: 'SessionEventMap · core/session/src/types.ts:285'
  },
  {
    seq: 23, t: 2424, name: 'agent/status → idle', kind: 'cordis', mode: 'emit',
    gist: 'agent 回到空闲（与 #3 配对）',
    use: '这一轮彻底结束。串行化后续任务、关闭进度指示、触发总结都可以挂在这里。',
    code: "ctx.on('agent/status', ({ status }) => {\n    if (status === 'idle') { /* ... */ }\n})",
    src: 'packages/core/agent/src/runtime-types.ts:277'
  }
];

const KIND_LABEL = { cordis: 'Cordis 事件', record: '会话日志记录' };
const fmt = (ms) => ms >= 1000 ? (ms / 1000).toFixed(2).replace(/0$/, '') + 's' : ms + 'ms';
const durationText = (e) => e.end ? fmt(e.t) + ' → ' + fmt(e.end) + '（' + (e.end - e.t) + 'ms）' : '瞬时 · ' + fmt(e.t);

const inner = document.getElementById('inner');
const detail = document.getElementById('detail');
const scroller = document.getElementById('scroller');
let current = null;
let zoom = 1;

events.forEach((e) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.kind = e.kind;
  row.dataset.seq = String(e.seq);
  row.setAttribute('role', 'button');
  row.setAttribute('tabindex', '0');
  row.setAttribute('aria-selected', 'false');

  const label = document.createElement('div');
  label.className = 'label';
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = fmt(e.t);
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = e.name;
  label.append(time, name);

  const track = document.createElement('div');
  track.className = 'track';
  const start = (e.t / TOTAL) * 100;
  if (e.end) {
    const fill = document.createElement('div');
    fill.className = 'fill ' + e.kind;
    fill.style.left = start + '%';
    fill.style.width = Math.max(((e.end - e.t) / TOTAL) * 100, 0.4) + '%';
    track.appendChild(fill);
  } else {
    const marker = document.createElement('div');
    marker.className = 'marker ' + e.kind;
    marker.style.left = start + '%';
    track.appendChild(marker);
  }
  const pct = document.createElement('div');
  pct.className = 'pct' + (start > 78 ? ' flip' : '');
  pct.style.left = start + '%';
  pct.textContent = start.toFixed(1) + '%';
  track.appendChild(pct);

  row.append(label, track);
  row.addEventListener('click', () => select(e.seq));
  row.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(e.seq); }
  });
  inner.appendChild(row);
});

function select(seq) {
  const e = events.find((x) => x.seq === seq);
  if (!e) return;
  current = seq;
  document.querySelectorAll('.row').forEach((row) => {
    row.setAttribute('aria-selected', row.dataset.seq === String(seq) ? 'true' : 'false');
  });
  detail.innerHTML = '';

  const kicker = document.createElement('div');
  kicker.className = 'kicker';
  kicker.textContent = '#' + e.seq + ' · ' + KIND_LABEL[e.kind];

  const h2 = document.createElement('h2');
  h2.textContent = e.name;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML =
    '<span class="tag ' + e.kind + '">' + e.mode + '</span>' +
    '<span class="tag">' + durationText(e) + '</span>';

  const dl = document.createElement('dl');
  const add = (term, value, isCode) => {
    const dt = document.createElement('dt');
    dt.textContent = term;
    const dd = document.createElement('dd');
    if (isCode) { const pre = document.createElement('pre'); pre.textContent = value; dd.appendChild(pre); }
    else { dd.textContent = value; }
    dl.append(dt, dd);
  };
  add('是什么', e.gist);
  add('能用来做什么', e.use);
  add('监听写法', e.code, true);
  add('声明位置', e.src);

  detail.append(kicker, h2, meta, dl);
}

// 筛选
document.querySelectorAll('[data-filter]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.filter === filter));
    });
    document.querySelectorAll('.row').forEach((row) => {
      row.classList.toggle('hidden', !(filter === 'all' || row.dataset.kind === filter));
    });
    const selected = document.querySelector('.row[aria-selected="true"]');
    if (!selected || selected.classList.contains('hidden')) {
      const first = [...document.querySelectorAll('.row')].find((r) => !r.classList.contains('hidden'));
      if (first) select(Number(first.dataset.seq));
    }
  });
});

// 缩放：撑宽内容 → 轨道随之变宽，超出部分靠横向滚动看。滚动位置按比例保留。
document.querySelectorAll('[data-zoom]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const next = Number(btn.dataset.zoom);
    if (next === zoom) return;
    const ratio = next / zoom;
    const keep = scroller.scrollLeft * ratio;
    zoom = next;
    document.querySelectorAll('[data-zoom]').forEach((b) => {
      b.setAttribute('aria-pressed', String(Number(b.dataset.zoom) === next));
    });
    if (TRACK[next]) inner.style.setProperty('--track', TRACK[next]);
    else inner.style.removeProperty('--track');
    requestAnimationFrame(() => { scroller.scrollLeft = keep; });
  });
});

// 键盘上下切换
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  const visible = [...document.querySelectorAll('.row')].filter((r) => !r.classList.contains('hidden'));
  if (!visible.length) return;
  const idx = visible.findIndex((r) => r.dataset.seq === String(current));
  const nextIdx = ev.key === 'ArrowDown' ? Math.min(idx + 1, visible.length - 1) : Math.max(idx - 1, 0);
  const target = visible[nextIdx === -1 ? 0 : nextIdx];
  ev.preventDefault();
  select(Number(target.dataset.seq));
  target.scrollIntoView({ block: 'nearest' });
});

select(1);
</script>
</body>
</html>
