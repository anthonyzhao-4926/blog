# dsh-code-lab 的 bundle 补丁：三行，顺序重要。
# 1) 代码运行时服务定义；2) 工作线程提供方（真正执行的那一层）；
# 3) 我们的工具。代码执行是可选能力，不属于 agent loop 主干，base 不一定挂。
- insert:
    - id: code-lab-runtime
      name: '@deepseek-ai/dsh-code-runtime'
    - id: code-lab-worker
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'
    - id: code-lab
      name: '/绝对路径/dsh-code-lab/src/dsh-code-lab.ts'
