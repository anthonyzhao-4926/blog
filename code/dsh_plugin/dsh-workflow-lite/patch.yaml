# dsh-workflow-lite 的 bundle 补丁：三行，顺序重要。
# 1) 工作流服务定义；2) 工作线程提供方（真正跑脚本的引擎）；3) 我们的工具。
# base 组合不一定挂引擎，所以自给自足。
- insert:
    - id: workflow-lite-engine
      name: '@deepseek-ai/dsh-workflow'
    - id: workflow-lite-worker
      name: '@deepseek-ai/dsh-workflow-worker-thread'
    - id: workflow-lite
      name: '/绝对路径/dsh-workflow-lite/src/dsh-workflow-lite.ts'
