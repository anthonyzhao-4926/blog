# dsh-nav-kit 的 bundle 补丁：五条插入行，前半段是代码导航，后半段是终端。
#
# LSP 那一半必须自己插：dsh-lsp 这个服务定义连出厂装配都没有，
# 全仓只在 e2b 的测试组合里出现过一次。它发布在 npm 上，profile 装得到。
#
# 终端那一半：PTY 的后端与我们的消费者都要自己插。出厂的 minimal 预设里
# 已经挂了 dsh-terminal 与 dsh-terminal-bash——如果你的 profile 用的是那个
# 预设，把下面 nav-kit-pty / nav-kit-pty-bash 两行删掉，否则会重复注册。
- insert:
    - id: nav-kit-lsp
      name: '@deepseek-ai/dsh-lsp'

    - id: nav-kit-md-links
      name: '/绝对路径/dsh-nav-kit/src/md-links.ts'

    - id: nav-kit-terminal-journal
      name: '/绝对路径/dsh-nav-kit/src/terminal-journal.ts'
      config:
        # 一页 200 行；后端仍会按 256 KiB 的默认上限再截一次。
        pageLines: 200

    - id: nav-kit-pty
      name: '@deepseek-ai/dsh-terminal'

    - id: nav-kit-pty-bash
      name: '@deepseek-ai/dsh-terminal-bash'
