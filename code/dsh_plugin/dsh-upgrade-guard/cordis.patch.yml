# dsh-upgrade-guard 的 bundle 补丁：三行，顺序重要。
# 1) 运行期不变式服务：base 组合刻意不挂（dsh-base deliberately omits runtime
#    diagnostics），所以自检包自己把服务插进来。写法照 sdk-minimal。
# 2) 主插件：读内核版本 + 挂 HTTP 报告。
# 3) invariant companion：不满足 engines.dsh 就 fail()。
- insert:
    - id: upgrade-guard-invariants
      name: '@deepseek-ai/dsh-invariants'
    - id: upgrade-guard
      name: '__PLUGIN_DIR__/lib/index.js'
      config:
        enginesDsh: '^0.2.0-rc.2'
    - id: upgrade-guard-invariant
      name: '__PLUGIN_DIR__/lib/invariant.js'
