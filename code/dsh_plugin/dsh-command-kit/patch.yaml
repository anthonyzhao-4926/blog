# dsh-command-kit 的 bundle 补丁：两行插件，各注册一条命令。
#
# commands 注册表本身出厂就有（base bundle 一行 @deepseek-ai/dsh-commands），
# 这里只补生产者：`/brief` 与 `/kit-stats`。
#
# 插件行直接指 src/*.ts —— 源码加载这条路（第 34 篇的 dsh-nav-kit 也这么写的），
# 省掉一次构建；要跟内置包一样走 JS 产物的话，改成 lib/*.js 再补一个 build 脚本即可。
- insert:
    - id: command-kit-brief
      name: '/绝对路径/dsh-command-kit/src/brief.ts'
      config:
        instruction: '写一份单页简报，markdown 格式，开头用一级标题点明主题。写完调用 present 把它交付出来。'
        # 改成 false 再重装，同样是贴图敲 /brief，这次会在 handler 之前被拒。
        acceptAttachments: true

    - id: command-kit-stats
      name: '/绝对路径/dsh-command-kit/src/stats.ts'
