# dsh-webhook-lab 的 bundle 补丁：三行，顺序重要。
# 1) webhook 运行时（拥有回调生命周期与会话创建）；
# 2) GitHub 适配器（拥有验签与 JSON 接收，在 WebServer 上注册精确路由）；
# 3) 我们的规则。
- insert:
    - id: webhook-lab-runtime
      name: '@deepseek-ai/dsh-webhook'
    - id: webhook-lab-github
      name: '@deepseek-ai/dsh-webhook-github'
    - id: webhook-lab
      name: '/绝对路径/dsh-webhook-lab/src/dsh-webhook-lab.ts'
