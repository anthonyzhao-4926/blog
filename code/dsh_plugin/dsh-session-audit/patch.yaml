# dsh-session-audit 的 bundle 补丁：一行插件。
#
# 它只读：会话根目录 + `ctx.sessionPersistence.list()`。
# 不 open('write')、不 publish、不迁移——体检完原样放着。
- insert:
    - id: session-audit
      name: '/绝对路径/dsh-session-audit/src/index.ts'
      config:
        # 留空则取 $DSH_HOME/sessions。要体检别处的会话根时填绝对路径。
        sessionsRoot: ''
